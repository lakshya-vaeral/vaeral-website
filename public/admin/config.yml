# Decap CMS configuration for the Vaeral site.
# The marketer edits forms here; Decap commits Markdown to GitHub; Vercel
# rebuilds (npm run build → node build.js) and serves dist/. See docs/CMS-PLAN.md.

backend:
  name: github
  repo: lakshya-vaeral/vaeral-website
  # Branch Decap reads from and commits to. We are cutting over to main so
  # that posts published in the CMS go live on the main deployment instantly.
  branch: main
  # Self-hosted GitHub OAuth proxy (Vercel serverless fns in /api). base_url is
  # the origin that hosts /api/auth + /api/callback, and must match the origin
  # /admin is loaded from + the GitHub OAuth App's callback URL.
  base_url: https://www.vaeral.com
  auth_endpoint: api/auth

# Lets `npx decap-server` drive a local git checkout (only active on localhost;
# harmless in production). Run the proxy-free local flow per the setup doc.
local_backend: true

# Uploaded images land in public/assets (build syncs → dist/assets) and are
# referenced in content as /assets/<file>, matching the existing content.
media_folder: "public/assets"
public_folder: "/assets"

collections:
  # ---------------------------------------------------------------- Blog posts
  - name: "blog"
    label: "Blog posts"
    folder: "content/blog"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{fields.slug}}"          # filename = slug = output folder name
    identifier_field: title
    summary: "{{title}}  ·  /blog/{{slug}}"
    editor:
      preview: false                 # Framer design can't render here; avoid a misleading preview
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO title (browser tab / Google result)", name: "seoTitle", widget: "string", required: false, hint: "Optional. Overrides only the search-result and browser-tab title — the heading on the page stays the Title above. Keep it under 60 characters. Leave blank to reuse the Title." }
      - { label: "URL slug", name: "slug", widget: "string", hint: "Lowercase words with hyphens. Becomes /blog/<slug>. Don't change after publishing — it changes the URL." }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Description", name: "description", widget: "text", hint: "Meta description + listing excerpt. ~150–160 characters." }
      - { label: "Cover image", name: "coverImage", widget: "image", choose_url: false, media_library: { config: { multiple: false } } }
      - { label: "Cover image alt text", name: "coverAlt", widget: "string", required: false, hint: "Describes the cover image for screen readers / SEO. Optional — falls back to the title." }
      - { label: "Read time (minutes)", name: "readTime", widget: "number", required: false, value_type: "int", min: 1, hint: "Optional. Leave blank to auto-calculate from word count." }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", hint: "Write the article content. Do not use Heading 1 or 2 (H1/H2) inside the body, as the Title is already the main heading. Use Heading 3 (H3) for main sections." }

  # --------------------------------------------------------------- Case studies
  - name: "case-studies"
    label: "Case studies"
    folder: "content/case-studies"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{fields.slug}}"          # filename = slug = top-level output folder
    identifier_field: title
    summary: "{{title}}  ·  /{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "SEO title (browser tab / Google result)", name: "seoTitle", widget: "string", required: false, hint: "Optional. Overrides only the search-result and browser-tab title — the heading on the page stays the Title above. Keep it under 60 characters. Leave blank to reuse the Title." }
      - { label: "URL slug", name: "slug", widget: "string", hint: "Lowercase words with hyphens. Becomes /<slug> (top level). Don't change after publishing — it changes the URL." }
      - { label: "Category", name: "category", widget: "string", hint: "e.g. \"Online Pharmacy / Health & Wellness\". Shown under the title." }
      - { label: "Tags", name: "tags", widget: "list", hint: "The badge chips. Press enter after each tag." }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Description", name: "description", widget: "text", hint: "Meta / social-share description. ~150–160 characters." }
      - { label: "Cover image", name: "coverImage", widget: "image", required: false, choose_url: false, media_library: { config: { multiple: false } } }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: false }
      - { label: "The Problem", name: "problem", widget: "markdown", hint: "Rich text for the \"The Problem\" section." }
      - { label: "What We Did", name: "whatWeDid", widget: "markdown", hint: "Rich text for the \"What We Did\" section." }
      - { label: "The Results", name: "results", widget: "markdown", hint: "Rich text for the \"The Results\" section. Use a bulleted list for stats." }

  # -------------------------------------------------------------- Service pages
  # Reuses the case-study page design. The three sections below are the same three
  # regions, with headings you control instead of "The Problem / What We Did /
  # The Results".
  - name: "services"
    label: "Service pages"
    folder: "content/services"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{fields.slug}}"          # filename = slug = /services/<slug>
    identifier_field: title
    summary: "{{title}}  ·  /services/{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title (the heading on the page)", name: "title", widget: "string" }
      - { label: "SEO title (browser tab / Google result)", name: "seoTitle", widget: "string", required: false, hint: "Optional. Overrides only the search-result and browser-tab title. Keep under 60 characters." }
      - { label: "URL slug", name: "slug", widget: "string", hint: "Lowercase words with hyphens. Becomes /services/<slug>. Don't change after publishing — it changes the URL." }
      - { label: "Category (small line above the title)", name: "category", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "The badge chips. Press enter after each tag." }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Description", name: "description", widget: "text", hint: "Meta / social-share description. Keep under 155 characters." }
      - { label: "Cover image", name: "coverImage", widget: "image", required: false, choose_url: false, media_library: { config: { multiple: false } } }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: false }
      - { label: "Section 1 heading", name: "sectionOneHeading", widget: "string", hint: "e.g. \"What this is\"" }
      - { label: "Section 1 body", name: "sectionOne", widget: "markdown", hint: "Open with a direct 2-3 sentence answer to \"what is this and who is it for\" — this is the block AI answer engines lift." }
      - { label: "Section 2 heading", name: "sectionTwoHeading", widget: "string", hint: "e.g. \"How it works\"" }
      - { label: "Section 2 body", name: "sectionTwo", widget: "markdown", hint: "3-5 numbered steps. Use Heading 3 for each step." }
      - { label: "Section 3 heading", name: "sectionThreeHeading", widget: "string", hint: "e.g. \"Who it's for\"" }
      - { label: "Section 3 body", name: "sectionThree", widget: "markdown", hint: "Who it suits and who it does NOT. The honest negative case is disproportionately quoted by AI answers." }
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        summary: "{{fields.question}}"
        hint: "5-8 questions, phrased the way a customer would actually ask. These appear on the page AND as FAQ structured data — the two must match, so edit them here only."
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text", hint: "Lead with a direct 2-3 sentence answer, then any detail. No statistics unless you can cite a source." }

  # ---------------------------------------------------------------- Static pages
  - name: "pages"
    label: "Pages (About, etc.)"
    folder: "content/pages"
    extension: "md"
    format: "frontmatter"
    create: true
    slug: "{{fields.slug}}"          # filename = slug = /<slug>
    identifier_field: title
    summary: "{{title}}  ·  /{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Title (the heading on the page)", name: "title", widget: "string" }
      - { label: "SEO title (browser tab / Google result)", name: "seoTitle", widget: "string", required: false, hint: "Optional. Keep under 60 characters." }
      - { label: "URL slug", name: "slug", widget: "string", hint: "Becomes /<slug> at the top level. Don't change after publishing — it changes the URL." }
      - { label: "Category (small line above the title)", name: "category", widget: "string", required: false }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Description", name: "description", widget: "text", hint: "Meta / social-share description. Keep under 155 characters." }
      - { label: "Cover image", name: "coverImage", widget: "image", required: false, choose_url: false, media_library: { config: { multiple: false } } }
      - { label: "Draft (hide from site)", name: "draft", widget: "boolean", default: false }
      - { label: "Section 1 heading", name: "sectionOneHeading", widget: "string" }
      - { label: "Section 1 body", name: "sectionOne", widget: "markdown" }
      - { label: "Section 2 heading", name: "sectionTwoHeading", widget: "string" }
      - { label: "Section 2 body", name: "sectionTwo", widget: "markdown" }
      - { label: "Section 3 heading", name: "sectionThreeHeading", widget: "string" }
      - { label: "Section 3 body", name: "sectionThree", widget: "markdown" }
      - label: "FAQs"
        name: "faqs"
        widget: "list"
        required: false
        summary: "{{fields.question}}"
        fields:
          - { label: "Question", name: "question", widget: "string" }
          - { label: "Answer", name: "answer", widget: "text" }
