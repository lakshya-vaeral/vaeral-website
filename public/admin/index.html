<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Keep this admin out of search results. -->
  <meta name="robots" content="noindex" />
  <title>Vaeral CMS</title>
  <!-- Load config from an absolute path. Without this, visiting /admin (no
       trailing slash) makes Decap fetch /config.yml at the site root → 404. -->
  <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
</head>
<body>
  <!-- Sign-in is Google (api/auth.js), but Decap's github backend labels its button for GitHub. -->
  <script>
    new MutationObserver(function () {
      var b = document.querySelector('button[class*="LoginButton"]');
      if (!b) return;
      b.childNodes.forEach(function (n) { if (n.nodeType === 3 && n.nodeValue === 'Login with GitHub') n.nodeValue = 'Sign in with Google'; });
      var icon = b.querySelector('[class*="LoginButtonIcon"]');
      if (icon) icon.style.display = 'none';
    }).observe(document.body, { childList: true, subtree: true, characterData: true });
  </script>
  <!-- Decap CMS — the entire editor UI. Config lives in ./config.yml -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
